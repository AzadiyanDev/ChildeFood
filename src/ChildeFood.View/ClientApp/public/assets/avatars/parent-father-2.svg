<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه کهربایی گرم -->
    <linearGradient id="bg-pf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <!-- گرادیان پیراهن پولوشرت سبز زیتونی/تیل -->
    <linearGradient id="shirt-pf2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <!-- گرادیان پوست -->
    <linearGradient id="skin-pf2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B6"/>
      <stop offset="100%" stop-color="#F7BA91"/>
    </linearGradient>
    <!-- گرادیان ریش و موی قهوه‌ای سوخته -->
    <linearGradient id="beard-pf2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#291102"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-pf2)" stroke="#FCD34D" stroke-width="2.5"/>

  <!-- شانه و پیراهن پولوشرت کژوال -->
  <path d="M22 116 C22 92 36 84 60 84 C84 84 98 92 98 116 Z" fill="url(#shirt-pf2)"/>

  <!-- یقه پولوشرت با لبه سفید ملایم -->
  <polygon points="60,94 46,84 60,88 74,84" fill="#115E59"/>
  <rect x="58" y="92" width="4" height="24" rx="2" fill="#134E4A"/>
  <!-- دکمه پولوشرت -->
  <circle cx="60" cy="98" r="1.2" fill="#CCFBF1"/>
  <circle cx="60" cy="106" r="1.2" fill="#CCFBF1"/>

  <!-- گردن -->
  <rect x="52" y="70" width="16" height="18" rx="4" fill="#F7BA91"/>

  <!-- گوش‌ها -->
  <circle cx="34" cy="56" r="6.5" fill="#F7BA91"/>
  <circle cx="86" cy="56" r="6.5" fill="#F7BA91"/>
  <circle cx="34" cy="56" r="3.5" fill="#E89B6F"/>
  <circle cx="86" cy="56" r="3.5" fill="#E89B6F"/>

  <!-- صورت -->
  <path d="M38 48 C38 34 82 34 82 48 C82 66 76 74 60 74 C44 74 38 66 38 48 Z" fill="url(#skin-pf2)"/>

  <!-- ریش و سبیل مرتب و مردانه شیک -->
  <path d="M40 56 C38 68 44 78 60 78 C76 78 82 68 80 56 C77 66 71 72 60 72 C49 72 43 66 40 56 Z" fill="url(#beard-pf2)"/>
  <!-- سبیل متصل -->
  <path d="M48 64 Q60 62 72 64 Q60 68 48 64 Z" fill="url(#beard-pf2)"/>

  <!-- چشم‌ها با نگاه گرم و صمیمی -->
  <ellipse cx="49" cy="51" rx="3.2" ry="3.3" fill="#1E293B"/>
  <ellipse cx="71" cy="51" rx="3.2" ry="3.3" fill="#1E293B"/>
  <circle cx="48" cy="49.8" r="1.1" fill="#FFFFFF"/>
  <circle cx="70" cy="49.8" r="1.1" fill="#FFFFFF"/>

  <!-- خطوط خنده اطراف چشم -->
  <path d="M43 51 Q41 53 44 54" stroke="#D99B77" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M77 51 Q79 53 76 54" stroke="#D99B77" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- ابروهای مردانه خوش‌حالت -->
  <path d="M43 44 Q49 42 54 44" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M66 44 Q71 42 77 44" stroke="#451A03" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- بینی -->
  <path d="M59 53 Q60 57 62 54" stroke="#D98254" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- موهای فید و استایل روز با بافت -->
  <path d="M36 46 C34 28 50 18 64 18 C78 18 86 28 85 45 C80 38 72 36 60 36 C48 36 42 40 36 46 Z" fill="url(#beard-pf2)"/>
  <path d="M44 26 Q56 20 68 22" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
