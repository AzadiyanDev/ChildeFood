<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه لطیف صورتی/یاسی -->
    <linearGradient id="bg-pm1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <!-- گرادیان روسری و حجاب شیک بنفش ملو -->
    <linearGradient id="hijab-pm1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- گرادیان لباس زیرین -->
    <linearGradient id="dress-pm1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <!-- گرادیان پوست روشن و طبیعی -->
    <linearGradient id="skin-pm1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D7"/>
      <stop offset="100%" stop-color="#F9CAA7"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-pm1)" stroke="#E9D5FF" stroke-width="2.5"/>

  <!-- شانه و بالاتنه لباس مادر -->
  <path d="M22 116 C22 92 36 84 60 84 C84 84 98 92 98 116 Z" fill="url(#dress-pm1)"/>

  <!-- افتادگی گوشه‌های روسری روی شانه‌ها -->
  <path d="M24 116 C26 94 38 78 52 76 C56 90 48 106 38 116 Z" fill="#7C3AED" opacity="0.9"/>
  <path d="M96 116 C94 94 82 78 68 76 C64 90 72 106 82 116 Z" fill="#7C3AED" opacity="0.9"/>

  <!-- گردن و زیرسازی حجاب -->
  <path d="M48 64 C48 78 72 78 72 64 Z" fill="url(#skin-pm1)"/>

  <!-- فرم کلی روسری دور سر -->
  <path d="M30 52 C30 26 42 18 60 18 C78 18 90 26 90 52 C90 76 80 84 60 84 C40 84 30 76 30 52 Z" fill="url(#hijab-pm1)"/>

  <!-- فرم بیضی صورت نمایان داخل روسری -->
  <ellipse cx="60" cy="52" rx="19" ry="22" fill="url(#skin-pm1)"/>

  <!-- لبه هدبند یا شال زیرین لطیف -->
  <path d="M42 38 Q60 33 78 38 Q60 30 42 38 Z" fill="#DDD6FE"/>

  <!-- گل‌سینه طلایی یا سنجاق نگین‌دار شیک -->
  <circle cx="60" cy="80" r="3.2" fill="#F59E0B"/>
  <circle cx="60" cy="80" r="1.5" fill="#FEF3C7"/>

  <!-- گونه‌های ملایم و باطراوت -->
  <circle cx="47" cy="57" r="3.5" fill="#F43F5E" opacity="0.25"/>
  <circle cx="73" cy="57" r="3.5" fill="#F43F5E" opacity="0.25"/>

  <!-- چشم‌های درشت و مهربان با مژه‌های ظریف -->
  <ellipse cx="50" cy="50" rx="3" ry="3.2" fill="#1E293B"/>
  <ellipse cx="70" cy="50" rx="3" ry="3.2" fill="#1E293B"/>
  <!-- برق نگاه -->
  <circle cx="49" cy="48.8" r="1.1" fill="#FFFFFF"/>
  <circle cx="69" cy="48.8" r="1.1" fill="#FFFFFF"/>
  <!-- مژه‌های ملایم -->
  <path d="M46 48 L44 46 M54 48 L56 46" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M66 48 L64 46 M74 48 L76 46" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ابروهای ظریف و کشیده -->
  <path d="M44 44 Q50 41 55 43" stroke="#4C1D95" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M65 43 Q70 41 76 44" stroke="#4C1D95" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- بینی ظریف زنانه -->
  <path d="M59 52 Q60 55 62 53" stroke="#E69566" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- لبخند مهربان مادرانه با رژلب ملایم کالباسی -->
  <path d="M53 61 Q60 66 67 61" stroke="#E11D48" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M54 61 Q60 63 66 61" fill="#FDA4AF" opacity="0.5"/>
</svg>
