<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه بنفش یاسی -->
    <linearGradient id="bg-cgp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <!-- گرادیان هودی بنفش ملایم -->
    <linearGradient id="hoodie-cgp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <!-- گرادیان پوست روشن -->
    <linearGradient id="skin-cgp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D7"/>
      <stop offset="100%" stop-color="#F8CCA8"/>
    </linearGradient>
    <!-- موهای تیره با هایلایت -->
    <linearGradient id="hair-cgp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261208"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-cgp)" stroke="#D8B4FE" stroke-width="2.5"/>

  <!-- دم‌اسبی مو پشت سر سمت راست و بالا -->
  <path d="M72 32 C88 20 102 36 94 62 C88 56 80 48 72 40 Z" fill="url(#hair-cgp)"/>
  <circle cx="74" cy="36" r="4.5" fill="#EC4899"/>

  <!-- بالاتنه هودی کژوال -->
  <path d="M26 116 C26 92 38 82 60 82 C82 82 94 92 94 116 Z" fill="url(#hoodie-cgp)"/>
  <!-- بندهای هودی -->
  <path d="M54 84 L53 104" stroke="#F3E8FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M66 84 L67 104" stroke="#F3E8FF" stroke-width="2" stroke-linecap="round"/>

  <!-- گردن -->
  <rect x="53" y="70" width="14" height="15" rx="3" fill="#F8CCA8"/>

  <!-- گوش‌ها -->
  <circle cx="36" cy="57" r="6" fill="#F8CCA8"/>
  <circle cx="84" cy="57" r="6" fill="#F8CCA8"/>

  <!-- صورت ظریف دخترانه -->
  <ellipse cx="60" cy="54" rx="22" ry="24" fill="url(#skin-cgp)"/>

  <!-- رژگونه طبیعی -->
  <circle cx="45" cy="60" r="4" fill="#FB7185" opacity="0.4"/>
  <circle cx="75" cy="60" r="4" fill="#FB7185" opacity="0.4"/>

  <!-- چشم‌های براق و خندان -->
  <ellipse cx="49" cy="52" rx="3.2" ry="3.4" fill="#1E293B"/>
  <ellipse cx="71" cy="52" rx="3.2" ry="3.4" fill="#1E293B"/>
  <circle cx="48" cy="50.6" r="1.2" fill="#FFFFFF"/>
  <circle cx="70" cy="50.6" r="1.2" fill="#FFFFFF"/>
  <circle cx="50" cy="53" r="0.6" fill="#FFFFFF"/>
  <circle cx="72" cy="53" r="0.6" fill="#FFFFFF"/>

  <!-- مژه‌های ناز -->
  <path d="M45 49 L43 47 M53 49 L55 47" stroke="#1E293B" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M67 49 L65 47 M75 49 L77 47" stroke="#1E293B" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ابروها -->
  <path d="M44 45 Q49 43 53 45" stroke="#261208" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M67 45 Q71 43 76 45" stroke="#261208" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- بینی -->
  <path d="M59 55 Q60 58 61 56" stroke="#E69566" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- لبخند شیرین -->
  <path d="M53 63 Q60 69 67 63" stroke="#BE185D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M54 63 Q60 66 66 63" fill="#F472B6" opacity="0.6"/>

  <!-- موهای جلوی سر چتری کج زیبا -->
  <path d="M36 46 C34 26 50 18 64 18 C78 18 86 26 84 46 C78 34 68 30 56 32 C46 34 40 38 36 46 Z" fill="url(#hair-cgp)"/>
</svg>
