<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه آبی آسمانی شاداب -->
    <linearGradient id="bg-pf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <!-- گرادیان پیراهن آبی ملو و شیک -->
    <linearGradient id="shirt-pf3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- گرادیان پوست -->
    <linearGradient id="skin-pf3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B6"/>
      <stop offset="100%" stop-color="#F7BA91"/>
    </linearGradient>
    <!-- گرادیان موهای مشکی حالت‌دار -->
    <linearGradient id="hair-pf3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-pf3)" stroke="#7DD3FC" stroke-width="2.5"/>

  <!-- شانه و پیراهن اسپرت -->
  <path d="M22 116 C22 90 36 82 60 82 C84 82 98 90 98 116 Z" fill="url(#shirt-pf3)"/>

  <!-- یقه پیراهن باز کژوال با تیشرت سفید زیرین -->
  <polygon points="60,110 50,82 60,86 70,82" fill="#FFFFFF"/>
  <path d="M46 84 L56 102 L44 94 Z" fill="#1E40AF"/>
  <path d="M74 84 L64 102 L76 94 Z" fill="#1E40AF"/>

  <!-- گردن -->
  <rect x="52" y="68" width="16" height="18" rx="4" fill="#F7BA91"/>

  <!-- گوش‌ها -->
  <circle cx="34" cy="56" r="6.5" fill="#F7BA91"/>
  <circle cx="86" cy="56" r="6.5" fill="#F7BA91"/>
  <circle cx="34" cy="56" r="3.5" fill="#E89B6F"/>
  <circle cx="86" cy="56" r="3.5" fill="#E89B6F"/>

  <!-- فرم چهره پرانرژی و متناسب -->
  <path d="M38 48 C38 34 82 34 82 48 C82 66 76 74 60 74 C44 74 38 66 38 48 Z" fill="url(#skin-pf3)"/>

  <!-- گونه‌های شاداب -->
  <circle cx="44" cy="59" r="4" fill="#FB923C" opacity="0.25"/>
  <circle cx="76" cy="59" r="4" fill="#FB923C" opacity="0.25"/>

  <!-- چشم‌ها با لبخند و نگاه براق -->
  <ellipse cx="49" cy="52" rx="3.3" ry="3.5" fill="#1E293B"/>
  <ellipse cx="71" cy="52" rx="3.3" ry="3.5" fill="#1E293B"/>
  <circle cx="47.8" cy="50.6" r="1.2" fill="#FFFFFF"/>
  <circle cx="69.8" cy="50.6" r="1.2" fill="#FFFFFF"/>

  <!-- ابروهای خوش‌حالت و زنده -->
  <path d="M42 45 Q49 42 55 44" stroke="#1F2937" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M65 44 Q71 42 78 45" stroke="#1F2937" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- بینی -->
  <path d="M59 54 Q60 58 62 55" stroke="#DF8A5C" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- لبخند دندان‌نمای صمیمی و گرم -->
  <path d="M50 63 Q60 72 70 63 Q60 67 50 63 Z" fill="#FFFFFF"/>
  <path d="M50 63 Q60 72 70 63" stroke="#D96F43" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- موهای حالت‌دار فشن و شیک بالا و بغل سر -->
  <path d="M35 46 C34 26 50 18 64 18 C80 18 86 28 85 45 C80 36 70 33 58 35 C46 37 40 41 35 46 Z" fill="url(#hair-pf3)"/>
  <!-- دسته موهای موج‌دار با بافت روی پیشانی -->
  <path d="M48 24 Q56 16 66 22 Q58 24 50 26 Z" fill="#374151"/>
</svg>
