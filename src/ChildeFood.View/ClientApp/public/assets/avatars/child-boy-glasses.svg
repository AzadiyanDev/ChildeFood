<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه زرد کهربایی شاد -->
    <linearGradient id="bg-cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <!-- لباس زرد خردلی/نارنجی -->
    <linearGradient id="shirt-cbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- گرادیان پوست -->
    <linearGradient id="skin-cbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEE4D2"/>
      <stop offset="100%" stop-color="#F8C4A0"/>
    </linearGradient>
    <!-- موهای فر شاه‌بلوطی -->
    <linearGradient id="hair-cbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#291102"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-cbg)" stroke="#FCD34D" stroke-width="2.5"/>

  <!-- شانه و لباس پاییزی کژوال -->
  <path d="M26 116 C26 92 38 82 60 82 C82 82 94 92 94 116 Z" fill="url(#shirt-cbg)"/>
  <polygon points="60,94 48,82 60,86 72,82" fill="#FFFFFF"/>

  <!-- گردن -->
  <rect x="53" y="70" width="14" height="16" rx="4" fill="#F8C4A0"/>

  <!-- گوش‌ها -->
  <circle cx="35" cy="56" r="6.5" fill="#F8C4A0"/>
  <circle cx="85" cy="56" r="6.5" fill="#F8C4A0"/>

  <!-- صورت گرد کودکانه -->
  <ellipse cx="60" cy="54" rx="23" ry="25" fill="url(#skin-cbg)"/>

  <!-- گونه‌های سرخالو -->
  <circle cx="43" cy="61" r="4.5" fill="#F87171" opacity="0.35"/>
  <circle cx="77" cy="61" r="4.5" fill="#F87171" opacity="0.35"/>

  <!-- فریم عینک گرد مدرن کودکانه (قرمز/شرابی جذاب) -->
  <circle cx="47" cy="52" r="8.5" fill="#F0FDFA" fill-opacity="0.3" stroke="#DC2626" stroke-width="2"/>
  <circle cx="73" cy="52" r="8.5" fill="#F0FDFA" fill-opacity="0.3" stroke="#DC2626" stroke-width="2"/>
  <path d="M55.5 51 Q60 49 64.5 51" stroke="#DC2626" stroke-width="2" fill="none"/>
  <path d="M38.5 52 L34 50 M81.5 52 L86 50" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round"/>

  <!-- چشم‌ها داخل فریم عینک -->
  <ellipse cx="47" cy="52" rx="2.8" ry="3.1" fill="#1E293B"/>
  <ellipse cx="73" cy="52" rx="2.8" ry="3.1" fill="#1E293B"/>
  <circle cx="46" cy="50.6" r="1.1" fill="#FFFFFF"/>
  <circle cx="72" cy="50.6" r="1.1" fill="#FFFFFF"/>

  <!-- ابروها بالای عینک -->
  <path d="M42 41 Q47 38 52 40" stroke="#451A03" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M68 40 Q73 38 78 41" stroke="#451A03" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- بینی فندقی -->
  <path d="M59 55 Q60 58 61 56" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- لبخند شاد دندان‌نما -->
  <path d="M52 64 Q60 72 68 64 Q60 67 52 64 Z" fill="#FFFFFF"/>
  <path d="M52 64 Q60 72 68 64" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- دسته‌های موی فر روی پیشانی و اطراف سر -->
  <circle cx="40" cy="34" r="9" fill="url(#hair-cbg)"/>
  <circle cx="52" cy="28" r="10" fill="url(#hair-cbg)"/>
  <circle cx="66" cy="27" r="10" fill="url(#hair-cbg)"/>
  <circle cx="78" cy="33" r="9" fill="url(#hair-cbg)"/>
  <circle cx="34" cy="44" r="7" fill="url(#hair-cbg)"/>
  <circle cx="86" cy="44" r="7" fill="url(#hair-cbg)"/>
  <circle cx="46" cy="36" r="6" fill="#78350F" opacity="0.6"/>
  <circle cx="70" cy="36" r="6" fill="#78350F" opacity="0.6"/>
</svg>
