<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- گرادیان پس‌زمینه فیروزه‌ای آسمانی -->
    <linearGradient id="bg-cgs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <!-- گرادیان مقنعه مدرسه سرمه‌ای -->
    <linearGradient id="maghnae-cgs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <!-- گرادیان پوست -->
    <linearGradient id="skin-cgs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDDEC7"/>
      <stop offset="100%" stop-color="#F7C4A5"/>
    </linearGradient>
    <!-- روپوش مدرسه طوسی/آبی -->
    <linearGradient id="uniform-cgs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- دایره پس‌زمینه -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-cgs)" stroke="#7DD3FC" stroke-width="2.5"/>

  <!-- روپوش و شانه مدرسه -->
  <path d="M24 116 C24 92 36 84 60 84 C84 84 96 92 96 116 Z" fill="url(#uniform-cgs)"/>

  <!-- فرم مقنعه مدرسه دانش‌آموزی -->
  <path d="M30 60 C30 26 42 16 60 16 C78 16 90 26 90 60 C90 86 78 108 60 114 C42 108 30 86 30 60 Z" fill="url(#maghnae-cgs)"/>

  <!-- نوار یا حاشیه تزیینی روبان مقنعه -->
  <path d="M42 36 Q60 30 78 36 Q60 27 42 36 Z" fill="#60A5FA"/>

  <!-- فرم صورت بیضی کودکانه -->
  <ellipse cx="60" cy="54" rx="20" ry="22" fill="url(#skin-cgs)"/>

  <!-- گونه‌های صورتی هلویی -->
  <circle cx="46" cy="60" r="4.5" fill="#FB7185" opacity="0.35"/>
  <circle cx="74" cy="60" r="4.5" fill="#FB7185" opacity="0.35"/>

  <!-- چشم‌های درشت و کنجکاو -->
  <circle cx="49" cy="53" r="3.4" fill="#1E293B"/>
  <circle cx="71" cy="53" r="3.4" fill="#1E293B"/>
  <circle cx="48" cy="51.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="70" cy="51.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="50" cy="54" r="0.6" fill="#FFFFFF"/>
  <circle cx="72" cy="54" r="0.6" fill="#FFFFFF"/>

  <!-- مژه‌های ملایم -->
  <path d="M45 49 L43 47 M53 49 L55 47" stroke="#172554" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M67 49 L65 47 M75 49 L77 47" stroke="#172554" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ابروهای ظریف -->
  <path d="M45 46 Q49 44 53 46" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M67 46 Q71 44 75 46" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- بینی فندقی ناز -->
  <path d="M59 56 Q60 59 61 56" stroke="#E69566" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- لبخند شاداب مدرسه -->
  <path d="M53 64 Q60 70 67 64" stroke="#E11D48" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M54 64 Q60 67 66 64" fill="#FDA4AF" opacity="0.6"/>

  <!-- گل‌سر ستاره کوچک گوشه مقنعه -->
  <polygon points="36,36 38,40 43,40 39,43 41,47 36,44 32,47 34,43 30,40 35,40" fill="#FBBF24"/>
</svg>
