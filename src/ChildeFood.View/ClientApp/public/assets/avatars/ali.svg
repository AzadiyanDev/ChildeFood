<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ali" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3EB"/>
      <stop offset="100%" stop-color="#FFE0D1"/>
    </linearGradient>
    <linearGradient id="shirt-ali" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="skin-ali" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B6"/>
      <stop offset="100%" stop-color="#F7BA91"/>
    </linearGradient>
    <linearGradient id="hair-ali" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1E16"/>
      <stop offset="100%" stop-color="#18110D"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-ali)" stroke="#FFD2BF" stroke-width="3"/>

  <!-- Body / School Uniform -->
  <path d="M26 114 C26 92 38 82 60 82 C82 82 94 92 94 114 Z" fill="url(#shirt-ali)"/>
  <!-- White Collar -->
  <polygon points="60,94 48,82 60,86 72,82" fill="#FFFFFF"/>
  <polygon points="60,98 56,86 64,86" fill="#E2E8F0"/>

  <!-- Neck -->
  <rect x="52" y="70" width="16" height="16" rx="4" fill="#F7BA91"/>

  <!-- Ears -->
  <circle cx="36" cy="56" r="7" fill="#F7BA91"/>
  <circle cx="84" cy="56" r="7" fill="#F7BA91"/>
  <circle cx="36" cy="56" r="4" fill="#ECA277"/>
  <circle cx="84" cy="56" r="4" fill="#ECA277"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="54" rx="24" ry="26" fill="url(#skin-ali)"/>

  <!-- Cheeks -->
  <circle cx="44" cy="60" r="4" fill="#FF8A65" opacity="0.35"/>
  <circle cx="76" cy="60" r="4" fill="#FF8A65" opacity="0.35"/>

  <!-- Eyes -->
  <circle cx="49" cy="53" r="3.2" fill="#1E293B"/>
  <circle cx="71" cy="53" r="3.2" fill="#1E293B"/>
  <!-- Eye highlights -->
  <circle cx="48" cy="51.5" r="1.1" fill="#FFFFFF"/>
  <circle cx="70" cy="51.5" r="1.1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M43 46 Q49 44 54 46" stroke="#2D1E16" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M66 46 Q71 44 77 46" stroke="#2D1E16" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M58 57 Q60 60 62 57" stroke="#E08E60" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M51 64 Q60 72 69 64" stroke="#8A3418" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M54 66 Q60 70 66 66" fill="#FFFFFF" opacity="0.9"/>

  <!-- Hair -->
  <path d="M35 50 C33 30 45 22 60 22 C75 22 87 30 85 50 C82 37 74 31 60 32 C45 31 38 38 35 50 Z" fill="url(#hair-ali)"/>
  <!-- Hair Tuft Details -->
  <path d="M52 23 Q60 16 68 23" fill="url(#hair-ali)"/>
  <path d="M42 32 Q48 24 55 28" fill="url(#hair-ali)"/>
  <path d="M65 27 Q72 25 78 33" fill="url(#hair-ali)"/>
</svg>
