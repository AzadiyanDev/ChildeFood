<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97352" />
      <stop offset="100%" stop-color="#e05432" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Food Cloche / Bowl Icon -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#shadow)">
    <!-- Base Plate -->
    <rect x="80" y="380" width="352" height="32" rx="16" fill="#ffffff" opacity="0.95" />
    <rect x="120" y="412" width="272" height="16" rx="8" fill="#ffffff" opacity="0.6" />
    
    <!-- Cloche Dome -->
    <path d="M 96 350 C 96 200, 416 200, 416 350 Z" fill="#ffffff" />
    
    <!-- Handle -->
    <circle cx="256" cy="180" r="28" fill="#ffffff" />
    <path d="M 244 196 L 268 196 L 264 220 L 248 220 Z" fill="#ffffff" />
    
    <!-- Steam / Aroma waves -->
    <path d="M 210 130 Q 225 100 210 70" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 256 120 Q 270 90 256 60" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 302 130 Q 315 100 302 70" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
