<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <linearGradient id="shirt-ava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="skin-ava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDDEC7"/>
      <stop offset="100%" stop-color="#F7C4A5"/>
    </linearGradient>
    <linearGradient id="hair-ava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="100%" stop-color="#261208"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-grad-ava)" stroke="#FFCCD5" stroke-width="3"/>

  <!-- Back Ponytails / Pigtails -->
  <circle cx="28" cy="46" r="13" fill="url(#hair-ava)"/>
  <circle cx="92" cy="46" r="13" fill="url(#hair-ava)"/>
  <!-- Hair Ties -->
  <circle cx="34" cy="49" r="4.5" fill="#F43F5E"/>
  <circle cx="86" cy="49" r="4.5" fill="#F43F5E"/>

  <!-- Body / School Shirt -->
  <path d="M28 114 C28 92 40 82 60 82 C80 82 92 92 92 114 Z" fill="url(#shirt-ava)"/>
  <!-- Rounded Peter Pan Collar -->
  <path d="M46 84 C52 89 59 86 60 84 C61 86 68 89 74 84 C68 93 52 93 46 84 Z" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="53" y="70" width="14" height="15" rx="3" fill="#F7C4A5"/>

  <!-- Ears -->
  <circle cx="36" cy="57" r="6" fill="#F7C4A5"/>
  <circle cx="84" cy="57" r="6" fill="#F7C4A5"/>
  <circle cx="36" cy="57" r="3" fill="#ECA277"/>
  <circle cx="84" cy="57" r="3" fill="#ECA277"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="55" rx="23" ry="24" fill="url(#skin-ava)"/>

  <!-- Cheeks Blush -->
  <circle cx="45" cy="61" r="4.5" fill="#FB7185" opacity="0.4"/>
  <circle cx="75" cy="61" r="4.5" fill="#FB7185" opacity="0.4"/>

  <!-- Sparkling Eyes -->
  <circle cx="49" cy="54" r="3.2" fill="#1E293B"/>
  <circle cx="71" cy="54" r="3.2" fill="#1E293B"/>
  <circle cx="48" cy="52.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="70" cy="52.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="50.2" cy="55.2" r="0.6" fill="#FFFFFF"/>
  <circle cx="72.2" cy="55.2" r="0.6" fill="#FFFFFF"/>

  <!-- Eyelashes -->
  <path d="M46 51 Q48 49 51 51" stroke="#372013" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M69 51 Q72 49 74 51" stroke="#372013" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M45 50 L43 48" stroke="#372013" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M75 50 L77 48" stroke="#372013" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M45 47 Q49 45 53 47" stroke="#4A2511" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M67 47 Q71 45 75 47" stroke="#4A2511" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Cute Nose -->
  <circle cx="60" cy="59" r="1.4" fill="#E29A71"/>

  <!-- Gentle Smile -->
  <path d="M53 65 Q60 71 67 65" stroke="#9F1239" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Front Hair / Bangs -->
  <path d="M37 53 C35 34 45 25 60 25 C75 25 85 34 83 53 C80 43 72 38 60 38 C48 38 40 43 37 53 Z" fill="url(#hair-ava)"/>
  <path d="M43 38 Q50 45 58 40" fill="url(#hair-ava)"/>
  <path d="M57 40 Q63 45 72 37" fill="url(#hair-ava)"/>

  <!-- Little Hair Clip / Flower -->
  <circle cx="41" cy="36" r="3.5" fill="#FACC15"/>
  <circle cx="41" cy="36" r="1.5" fill="#EA580C"/>
</svg>
